<style>
  :root{
    --ink:#0A0A0B;--ink-2:#161618;--bone:#F4F1EA;--bone-2:#E5E0D4;
    --yellow:#E6B422;--yellow-2:#F0C84A;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--ink);color:var(--bone);font-family:'Inter Tight',system-ui,sans-serif;font-weight:300;-webkit-font-smoothing:antialiased;line-height:1.6;min-height:100vh}
  img{max-width:100%;display:block}
  a{color:inherit;text-decoration:none}
  a:hover{color:var(--yellow-2)}
  button{cursor:pointer;font-family:inherit}
  nav{position:sticky;top:0;z-index:50;padding:12px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;background:rgba(10,10,11,.95);backdrop-filter:blur(12px);border-bottom:1px solid rgba(230,180,34,.28)}
  nav .l img{height:48px;width:auto;border-radius:8px}
  nav .r{display:flex;gap:18px;align-items:center}
  nav .r a{font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:500}
  nav .r .back{color:var(--yellow-2);font-weight:600}
  nav .r .ig{color:var(--yellow);font-weight:700;letter-spacing:.04em;font-size:14px;text-transform:none}
  .hero{position:relative;height:52vh;min-height:320px;overflow:hidden;background:var(--ink)}
  .hero img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.42}
  .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,11,.5),rgba(10,10,11,.2) 40%,rgba(10,10,11,.96));z-index:1}
  .hero-content{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 24px 40px;text-align:center}
  .hero-content .micro{font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--yellow);font-weight:700;margin-bottom:16px}
  .hero-content img.mark{width:min(160px,40vw);height:auto;border-radius:12px;box-shadow:0 12px 36px rgba(0,0,0,.75)}
  .hero-content .tag{margin-top:18px;font-size:clamp(15px,2vw,22px);font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#fff}
  .hero-content .sub{margin-top:10px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
  .filter{position:sticky;top:72px;z-index:40;background:rgba(10,10,11,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--ink-2);padding:14px 20px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .filter button{background:transparent;border:1px solid rgba(244,241,234,.16);color:var(--bone-2);font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:500;padding:10px 14px;transition:.2s}
  .filter button:hover{border-color:var(--yellow);color:var(--yellow)}
  .filter button.on{border-color:var(--yellow);background:var(--yellow);color:#111;font-weight:700}
  .cat{padding:72px 0 40px;border-top:1px solid var(--ink-2)}
  .cat.hide{display:none}
  .cat-head{padding:0 28px 36px}
  .cat-head .num{font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--yellow);font-weight:700;margin-bottom:10px}
  .cat-head h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;font-size:clamp(28px,4.5vw,48px);line-height:1}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
  .item{position:relative;aspect-ratio:5/4;overflow:hidden;background:var(--ink-2);border-right:1px solid var(--ink);border-bottom:1px solid var(--ink)}
  .item img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
  .item:hover img{transform:scale(1.04)}
  .item .meta{position:absolute;left:0;right:0;bottom:0;padding:20px;background:linear-gradient(0deg,rgba(10,10,11,.95),transparent);z-index:3}
  .item .meta .ti{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;font-size:18px;margin-bottom:4px}
  .item .meta .lc{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--yellow-2);font-weight:600}
  .item .badge{position:absolute;top:12px;left:12px;z-index:4;font-size:9px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;padding:6px 10px;background:rgba(10,10,11,.85);border:1px solid var(--yellow);color:var(--yellow)}
  @media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.grid{grid-template-columns:1fr}}
  footer{padding:56px 24px;text-align:center;border-top:1px solid var(--ink-2)}
  footer img{height:64px;margin:0 auto 14px;border-radius:10px}
  footer .lines{font-size:13px;opacity:.7;line-height:1.8}
  footer .demo{margin-top:14px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--yellow);opacity:.7}

/* === YG MOBILE HARD RULE (do not remove) === */
html,body{overflow-x:hidden!important;max-width:100%!important}
img,video{max-width:100%;height:auto}
nav,.filter,header,footer,.wrap,.hero-content,.cat-head,.hero:not(.hero-media),.page-cta .wrap,.preview .head,.about,.services,.contact,.cta-band,.strip,section.hero{
  box-sizing:border-box;
}
nav,.filter,header,footer{
  padding-left:max(16px, env(safe-area-inset-left))!important;
  padding-right:max(16px, env(safe-area-inset-right))!important;
}
.hero-content,.cat-head,.wrap,.about,.services,.contact,.cta-band,.preview .head,section.hero > .eyebrow,section.hero > h1,section.hero > p,.hero .content{
  padding-left:max(12px, env(safe-area-inset-left));
  padding-right:max(12px, env(safe-area-inset-right));
  box-sizing:border-box;
  max-width:100%;
}
.grid,.mosaic{width:100%;max-width:100%;box-sizing:border-box;min-width:0}
.item,.cell,.card{min-width:0;max-width:100%}
.item img,.cell img{width:100%;height:100%;object-fit:cover;display:block}


/* === YG LIGHTBOX HARD RULE (do not remove) === */
.item{cursor:pointer}
.yg-lb{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:9999;display:none;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));box-sizing:border-box}
.yg-lb.show{display:flex}
.yg-lb img{display:block;max-width:min(980px,calc(100vw - 32px));max-height:min(78vh,calc(100dvh - 120px));width:auto;height:auto;margin:auto;object-fit:contain;position:relative;z-index:1}
.yg-lb .yg-panel{position:absolute;left:max(16px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));right:max(16px,env(safe-area-inset-right));color:#fff;max-width:min(480px,100%);z-index:2;font:600 14px/1.35 system-ui,sans-serif}
.yg-lb .yg-close{position:absolute;top:max(10px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));color:#fff;font-size:30px;background:none;border:0;cursor:pointer;z-index:2;line-height:1}
.yg-lb .yg-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.12);border:0;color:#fff;font-size:28px;width:44px;height:44px;cursor:pointer;border-radius:50%;z-index:2}
.yg-lb .yg-prev{left:max(8px,env(safe-area-inset-left))}
.yg-lb .yg-next{right:max(8px,env(safe-area-inset-right))}

</style>
</head>

<script>
(function(){
  const filters=document.getElementById('filters');
  const sections=[...document.querySelectorAll('.cat')];
  filters.addEventListener('click',function(e){
    const btn=e.target.closest('button[data-filter]');
    if(!btn) return;
    filters.querySelectorAll('button').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on');
    const f=btn.dataset.filter;
    sections.forEach(s=>{
      if(f==='all' || s.dataset.section===f) s.classList.remove('hide');
      else s.classList.add('hide');
    });
  });
})();
</script>

<div class="yg-lb" id="ygLb" aria-hidden="true">
  <button class="yg-close" type="button" aria-label="Close">×</button>
  <button class="yg-nav yg-prev" type="button" aria-label="Previous">‹</button>
  <img alt="">
  <button class="yg-nav yg-next" type="button" aria-label="Next">›</button>
  <div class="yg-panel"></div>
</div>


<script>
(function(){
  if(window.__ygLbInit) return; window.__ygLbInit=true;
  var cards=[].slice.call(document.querySelectorAll('.item')).filter(function(c){return c.querySelector('img');});
  if(!cards.length) return;
  var lb=document.getElementById('ygLb');
  if(!lb){
    lb=document.createElement('div');
    lb.className='yg-lb'; lb.id='ygLb'; lb.setAttribute('aria-hidden','true');
    lb.innerHTML='<button class="yg-close" type="button" aria-label="Close">×</button><button class="yg-nav yg-prev" type="button" aria-label="Previous">‹</button><img alt=""><button class="yg-nav yg-next" type="button" aria-label="Next">›</button><div class="yg-panel"></div>';
    document.body.appendChild(lb);
  }
  var img=lb.querySelector('img');
  var panel=lb.querySelector('.yg-panel');
  var idx=0;
  function srcOf(card){
    var full=card.getAttribute('data-full')||card.getAttribute('data-img')||card.getAttribute('data-src')||'';
    var thumb=card.querySelector('img');
    if(full && (full.indexOf('http')===0 || full.indexOf('//')===0)) return full;
    if(thumb){
      var ds=thumb.getAttribute('data-src');
      if(ds && (ds.indexOf('http')===0 || ds.indexOf('//')===0)) return ds;
      return thumb.currentSrc||thumb.src||full;
    }
    return full;
  }
  function titleOf(card){
    var t=card.getAttribute('data-title');
    if(t) return t;
    var el=card.querySelector('.ti,.title,.meta .ti,h3');
    if(el) return (el.textContent||'').trim();
    var im=card.querySelector('img');
    return (im && im.alt)||'';
  }
  function openAt(i){
    idx=(i+cards.length)%cards.length;
    var card=cards[idx];
    img.src=srcOf(card);
    panel.textContent=titleOf(card);
    lb.classList.add('show');
    lb.setAttribute('aria-hidden','false');
    document.body.style.overflow='hidden';
  }
  function close(){
    lb.classList.remove('show');
    lb.setAttribute('aria-hidden','true');
    document.body.style.overflow='';
  }
  cards.forEach(function(card,i){
    card.style.cursor='pointer';
    card.addEventListener('click',function(e){
      if(e.target.closest && e.target.closest('a.cta,.cta')) return;
      e.preventDefault();
      openAt(i);
    });
  });
  lb.querySelector('.yg-close').addEventListener('click',close);
  lb.querySelector('.yg-prev').addEventListener('click',function(){openAt(idx-1)});
  lb.querySelector('.yg-next').addEventListener('click',function(){openAt(idx+1)});
  lb.addEventListener('click',function(e){if(e.target===lb) close()});
  document.addEventListener('keydown',function(e){
    if(!lb.classList.contains('show')) return;
    if(e.key==='Escape') close();
    if(e.key==='ArrowLeft') openAt(idx-1);
    if(e.key==='ArrowRight') openAt(idx+1);
  });
})();
</script>
